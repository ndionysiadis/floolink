name: Deploy to Forge

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the latest code
      - name: Checkout code
        uses: actions/checkout@v3

      # Trigger Forge deployment
      - name: Trigger Forge Deployment
        run: |
          curl -X POST "${{ secrets.FORGE_DEPLOY_URL }}"
